<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>No Current Plays</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .message {
      background: white;
      padding: 50px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      max-width: 500px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 15px;
      color: #222;
    }

    p {
      font-size: 20px;
      color: #666;
    }
  </style>
</head>

<body>

  <div class="message">
    <h1>Sorry!</h1>
    <p>We currently have no plays available.</p>
    <p>Please check back soon!</p>
  </div>

</body>
</html>
